    <circle cx="1112" cy="66" r="230" fill="url(#glow)"/>
    <circle cx="188" cy="300" r="190" fill="url(#glow)"/>
  </g>
  <rect x="40" y="28" width="1200" height="264" rx="24" fill="none" stroke="#e2e8f0" stroke-opacity="0.10"/>
  <rect x="40" y="28" width="1200" height="5" rx="2.5" fill="url(#rule)"/>

  <g>
