      <rect x="210" y="-20" width="112" height="31" rx="15.5" fill="#1e293b" stroke="#334155"/>
      <text x="266" y="1" text-anchor="middle">用友 U8</text>
      <rect x="332" y="-20" width="112" height="31" rx="15.5" fill="#1e293b" stroke="#334155"/>
